global_costmap:
  ros__parameters:
    global_frame: map                # Harita referans çerçevesi
    robot_base_frame: base_link      # Robotun taban çerçevesi
    update_frequency: 1.0            # Haritanın güncellenme sıklığı (Hz)
    publish_frequency: 1.0           # Haritanın yayınlanma sıklığı (Hz)
    resolution: 0.05                 # Harita çözünürlüğü (metre/piksel)
    size_x: 50.0                     # Harita genişliği (metre)
    size_y: 50.0                     # Harita yüksekliği (metre)
    origin_x: -25.0                  # Harita başlangıç koordinatı (x)
    origin_y: -25.0                  # Harita başlangıç koordinatı (y)
    plugins:                         # Harita katmanları
      - static_layer
      - obstacle_layer
      - inflation_layer

    static_layer:
      map_subscribe_transient_local: True

    obstacle_layer:
      max_obstacle_height: 2.0       # Engel algılama için maksimum yükseklik
      inflation_radius: 0.5          # Engellerin çevresindeki güvenlik alanı

    inflation_layer:
      inflation_radius: 0.5
      cost_scaling_factor: 10.0

planner_server:
  ros__parameters:
    planner_plugins: ["NavfnPlanner"]
    expected_planner_frequency: 20.0  # Global planner'ın çalışma frekansı (Hz)
    use_sim_time: True                # Simülasyon zamanı kullanımı
    NavfnPlanner:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5  # Hedef etrafındaki tolerans (metre)
      use_astar: false  # A* için `true` : Dijkstra'yı kullanmak için `false`

